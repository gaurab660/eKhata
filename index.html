async function sendApi(p){const c=apiCfg();if(!c.url)throw new Error('API ठेगाना राखिएको छैन');if(!/^https:\/\//i.test(c.url))throw new Error('सुरक्षित ठेगाना मात्र स्वीकार्य छ (https://)');const k=(await apiKeyGet())||c.key;/*[GSHEET]*/if(GS(c.url)){let j;try{const r=await fetch(c.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({secret:k||''},p))});if(!r.ok)throw new Error('HTTP '+r.status);j=await r.json()}catch(x){throw new Error(x&&x.message&&/HTTP/.test(x.message)?x.message:'जडान भएन (इन्टरनेट वा Apps Script ठेगाना जाँच्नुहोस्)')}if(!j||!j.ok)throw new Error('Sheet ले स्वीकारेन'+(j&&j.err?': '+j.err:''));return j}const h={'Content-Type':'application/json','Idempotency-Key':p.ref};if(k)h[c.kh]=c.kp+k;let r;try{r=await fetch(c.url,{method:'POST',headers:h,body:JSON.stringify(p)})}catch(x){throw new Error('जडान भएन (इन्टरनेट वा वेबसाइटले अनुमति दिएन — CORS)')}if(!r.ok)throw new Error('HTTP '+r.status);return r}

/* ===== प्रयोगकर्ता, पद र अनुमति ===== (सफ्ट लक — यो फोनको ब्राउजरभित्रको मात्र सुरक्षा) */
function uh(s){let h=5381,g=52711;s=String(s);for(let i=0;i<s.length;i++){h=(h*33^s.charCodeAt(i))>>>0;g=(g*31+s.charCodeAt(i)*7)>>>0}return h.toString(36)+g.toString(36)}
/* ===== प्रमाणीकरण सुरक्षा (चरण १): PBKDF2-SHA256, नियम-आधारित पासवर्ड, सुरक्षित कोड, स्थायी लक ===== */
const PW_MIN=8,PW_ITER=150000,
PW_MSG='पासवर्ड कम्तीमा ८ अक्षरको हुनुपर्छ र अक्षर तथा अङ्क दुवै हुनुपर्छ',
NOCRYPTO='यो ब्राउजरमा सुरक्षित पासवर्ड सुविधा उपलब्ध छैन। एपलाई HTTPS ठेगानाबाट खोल्नुहोस्',
pwOk=p=>typeof p==='string'&&p.length>=PW_MIN&&p.length<=64&&/[A-Za-z\u0904-\u0939]/.test(p)&&/[0-9\u0966-\u096F]/.test(p),
b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},
b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
ceq=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
async function pbk(pw,salt,it){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256))}
async function hashPw(pw){const s=crypto.getRandomValues(new Uint8Array(16));return 'p2$'+PW_ITER+'$'+b64e(s)+'$'+b64e(await pbk(pw,s,PW_ITER))}
async function verPw(pw,st){if(typeof st!=='string'||st.indexOf('p2$')!==0)return false;const p=st.split('$');if(p.length!==4)return false;const it=+p[1];if(!(it>=1e5&&it<=1e6))return false;return ceq(await pbk(pw,b64d(p[2]),it),b64d(p[3]))}
/* पुरानो (कमजोर) hash भए सफल लगइनमा आफैँ नयाँमा बदलिन्छ */
async function chkUser(u,pw,raw){if(u.pin&&u.pin.indexOf('p2$')===0)return verPw(pw,u.pin);if(u.pin===uh(u.id+':'+raw)){try{u.pin=await hashPw(pw);save()}catch(e){}return true}return false}
function rnd(n){const a=new Uint32Array(1),lim=4294967296-4294967296%n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
const RC_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

 vC=view(vc,x=>{if(!x.mk)x.mk=mk;M.cust.push(x)}),vE=view(ve,x=>M.ent.push(x)),P=mk+'~',
 kv=key=>new Proxy({},{get:(_,d)=>typeof d==='string'?(M[key]||{})[P+d]:undefined,set:(_,d,v)=>{(M[key]=M[key]||{})[P+d]=v;return true},has:(_,d)=>(P+d) in (M[key]||{}),deleteProperty:(_,d)=>{delete (M[key]||{})[P+d];return true},ownKeys:()=>Object.keys(M[key]||{}).filter(k=>k.startsWith(P)).map(k=>k.slice(P.length)),getOwnPropertyDescriptor:(_,d)=>(P+d) in (M[key]||{})?{enumerable:true,configurable:true,writable:true,value:M[key][P+d]}:undefined}),

 return new Proxy(M,{get(t,p){return p==='cust'?vC:p==='ent'?vE:p==='closed'?vK:p==='days'?vD:p==='toJSON'?()=>M:t[p]},set(t,p,v){if(p==='cust'){t.cust=[...t.cust.filter(c=>c.mk!==mk),...v];S.mkv=(S.mkv||0)+1}else if(p==='ent'){const s=ids();t.ent=[...t.ent.filter(e=>!s.has(e.cid)),...v]}else if(p!=='closed'&&p!=='days')t[p]=v;return true}})}

function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}

 return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

 if(Array.isArray(v))return'['+v.map(canon).join(',')+']';
 return'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'}

function applyRows(M,rows,loc){

 const ix=a=>{if(!IX[a]){IX[a]=new Map();(M[a]=M[a]||[]).forEach(x=>IX[a].set(String(x.id),x))}return IX[a]};
 const repl=(o,d)=>{Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,d)};
 const dead=(a,o)=>{(DEAD[a]=DEAD[a]||new Set()).add(o)};
 rows.forEach(r=>{
  const k=r.key,i=k.indexOf(':'),kind=k.slice(0,i),id=k.slice(i+1),b=SY.base[k],l=loc[k],bhh=bh(b);
  if(r.del){ if(!(l&&b&&l.h===bhh))return; }
  else{
   const rh=cyrb(String(r.mk===undefined?null:r.mk)+'|'+canon(r.data));
   if(b&&bhh===rh)return;                 /* आफैँले पठाएको वा उस्तै */
   if(l&&b&&l.h!==bhh)return;             /* यो फोनमा सच्याइएको → यहाँको जित्छ */
   if(!l&&b)return;                       /* यो फोनमा मेटिएको → यहाँको जित्छ */
  }
  const A=ARR[kind];
  if(A){const m=ix(A),o=m.get(id);
   if(r.del){if(o){dead(A,o);m.delete(id)}}
   else if(o)repl(o,r.data);

   if(A=='cust')custT=1;

  }else if(kind=='alias'){
   if(!AX){AX=new Map();(M.alias=M.alias||[]).forEach(x=>AX.set(akey(x),x))}
   const o=AX.get(k);
   if(r.del){if(o){dead('alias',o);AX.delete(k)}}
   else if(o)repl(o,r.data);
   else{const n=Object.assign({},r.data);M.alias.push(n);AX.set(k,n)}
  }else if(kind=='closed'||kind=='days'){
   M[kind]=M[kind]||{};if(r.del)delete M[kind][id];else M[kind][id]=r.data
  }else if(kind=='log'){
   if(r.del)return;M.log=M.log||[];
   if(!LX)LX=new Set(M.log.map(x=>cyrb(x.ts+'|'+x.m+'|'+(x.k||''))));

  }else if(kind=='bseqm'){
   M.bseqm=M.bseqm||{};M.bseqm[id]=Math.max(+M.bseqm[id]||0,+r.data||0)
  }else if(kind=='top'){
   if(r.del)delete M[id];else M[id]=r.data
  }else return;
  keys.push(k)});
 Object.keys(DEAD).forEach(a=>{const keep=M[a].filter(x=>!DEAD[a].has(x));M[a].length=0;for(let j=0;j<keep.length;j++)M[a].push(keep[j])});

async function authCall(grant,body){
 const r=await fetch(U0()+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:AN(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||('लगइन '+r.status));e.status=r.status;throw e}

async function token(){
 if(!CC.at){CL.need=1;throw Object.assign(new Error('फेरि लगइन गर्नुहोस्'),{status:401})}
 if(Date.now()>(CC.exp||0)-60000)await refresh();return CC.at}

  const tok=await token();

  /* १) ल्याउने */
  let since=SY.since||EP,rows=[],guard=0;
  for(;;){
   const part=await rq('GET','/rest/v1/records?select=key,mk,data,del,su&order=su.asc&limit=1000&su=gte.'+encodeURIComponent(since)+selQ(),undefined,undefined,tok);
   for(let j=0;j<part.length;j++)rows.push(part[j]);CL.n=rows.length;
   if(part.length<1000||++guard>3000)break;
   since=part[part.length-1].su}
  const M=S.M||D;let loc=buildRecs(M);
  if(rows.length){
   const ks=applyRows(M,rows,loc);
   if(ks.length){loc=buildRecs(M);ks.forEach(k=>{if(loc[k])setBase(k,loc[k]);else delete SY.base[k]});CL.ui=1;S.mkv=(S.mkv||0)+1;LC={}}
   SY.since=rows[rows.length-1].su}
  /* २) मेटिएको जाँच (ठूलो मात्रामा मेटिए सोध्ने) */
  const delK=[];for(const k in SY.base){if(!loc[k]&&k.indexOf('log:')!==0)delK.push(k)}
  const nb=Object.keys(SY.base).length;
  if(delK.length>25&&delK.length>nb*.15){
   const okDel=confirm('⚠ यो फोनमा '+delK.length+' रेकर्ड हराएको देखियो (ब्याकअप फर्काउँदा / नयाँ अध्याय गर्दा यस्तो हुन्छ)।\n\nOK = क्लाउडबाट पनि सबैतिर मेट्ने\nCancel = मेट्ने होइन, क्लाउडबाट फिर्ता ल्याउने');
   if(!okDel){delK.forEach(k=>{delete SY.base[k]});SY.since=EP;js(KS,SY);CL.busy=0;st('sync');kick(300);return}}
  /* ३) पठाउने */
  const out=[];
  for(const k in loc){const l=loc[k],b=SY.base[k];if(b&&bh(b)===l.h)continue;if(SY.rej[k]===l.h)continue;
   if(!writable(k,l.mk)){setBase(k,l);continue}
   out.push({k,h:l.h,row:{key:k,mk:l.mk,data:l.d,del:false,ub:who()}})}
  delK.forEach(k=>{const m0=bmk(SY.base[k]);if(!writable(k,m0)){delete SY.base[k];return}out.push({k,h:'D',row:{key:k,mk:m0,data:null,del:true,ub:who()}})});
  CL.pend=out.length;CL.bad=Object.keys(SY.rej).length;
  const done=it=>{if(it.h==='D')delete SY.base[it.k];else setBase(it.k,loc[it.k]);delete SY.rej[it.k];CL.pend--};
  const send=async arr=>{
   if(!arr.length)return;
   try{await rq('POST','/rest/v1/records?on_conflict=key',arr.map(x=>x.row),{Prefer:'resolution=merge-duplicates,return=minimal'},tok);arr.forEach(done)}
   catch(e){
    if(e.status>=400&&e.status<500&&e.status!==401&&e.status!==429&&e.status!==408){
     if(arr.length>1){const m=arr.length>>1;await send(arr.slice(0,m));await send(arr.slice(m))}
     else{SY.rej[arr[0].k]=arr[0].h;CL.bad=Object.keys(SY.rej).length;CL.pend--}
    }else throw e}};
  for(let j=0;j<out.length;j+=150){await send(out.slice(j,j+150));js(KS,SY)}
  SY.last=Date.now();SY.acct=U0()+'|'+(CC.email||'');if(SY.fresh){SY.fresh=0;CL.ui=1}CL.first=0;CL.msg='';
  if(!js(KS,SY))throw new Error('फोनको मेमोरी भरियो — सेटिङ → ब्याकअप');
  st(CL.bad?'warn':'ok');
 }catch(e){
  const net=e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(String(e.message));
  if(net){st('off')}else{CL.msg=String(e.message||e);st('err')}
 }finally{CL.busy=0;pill();if(CL.again){CL.again=0;kick(1500)}if(CL.need||CL.first)try{render()}catch(e){}else refreshUI()}}

/* ===== सुरक्षित बारले लेखिरहेको खाना नछोपोस्: टकराए माथि/तल आफैँ सर्ने ===== */
(function(){
 var raf=0;
 function hit(a,b){return !(a.bottom<=b.top||a.top>=b.bottom)}
 function fix(){
  raf=0;
  var f=document.activeElement;
  if(!f||!/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)||!f.closest||f.closest('.sv'))return;
  var bars=document.querySelectorAll('.sv');
  var r=f.getBoundingClientRect(),rr={top:r.top-8,bottom:r.bottom+8};
  for(var i=0;i<bars.length;i++){
   var b=bars[i],br=b.getBoundingClientRect();
   if(!br.height)continue;
   if(hit(rr,br)){
    b.classList.toggle('svt');
    if(hit(rr,b.getBoundingClientRect()))b.classList.toggle('svt');
   }
  }
 }
 function sched(){if(!raf)raf=requestAnimationFrame(fix)}
 document.addEventListener('focusin',function(){setTimeout(sched,380)},true);
 document.addEventListener('input',sched,true);
 window.addEventListener('scroll',sched,{passive:true});
 window.addEventListener('resize',sched);
 if(window.visualViewport){visualViewport.addEventListener('resize',sched);visualViewport.addEventListener('scroll',sched)}
})();
</script>
