function uh(s){let h=5381,g=52711;s=String(s);for(let i=0;i<s.length;i++){h=(h*33^s.charCodeAt(i))>>>0;g=(g*31+s.charCodeAt(i)*7)>>>0}return h.toString(36)+g.toString(36)}

const PW_MIN=8,PW_ITER=150000,
PW_MSG='Password कम्तीमा ८ अक्षरको हुनुपर्छ र अक्षर तथा अङ्क दुवै हुनुपर्छ',
NOCRYPTO='यो ब्राउजरमा सुरक्षित Password सुविधा उपलब्ध छैन। Appलाई HTTPS ठेगानाबाट खोल्नुहोस्',
pwOk=p=>typeof p==='string'&&p.length>=PW_MIN&&p.length<=64&&/[A-Za-z\u0904-\u0939]/.test(p)&&/[0-9\u0966-\u096F]/.test(p),
b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},
b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
ceq=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
async function pbk(pw,salt,it){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256))}
async function hashPw(pw){const s=crypto.getRandomValues(new Uint8Array(16));return 'p2$'+PW_ITER+'$'+b64e(s)+'$'+b64e(await pbk(pw,s,PW_ITER))}
async function verPw(pw,st){if(typeof st!=='string'||st.indexOf('p2$')!==0)return false;const p=st.split('$');if(p.length!==4)return false;const it=+p[1];if(!(it>=1e5&&it<=1e6))return false;return ceq(await pbk(pw,b64d(p[2]),it),b64d(p[3]))}

const RC_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genRc(){let s='';for(let i=0;i<16;i++){s+=RC_AL[rnd(RC_AL.length)];if(i%4==3&&i<15)s+='-'}return s}
function genPw(){const sets=['abcdefghjkmnpqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789'],a=[];for(let i=0;i<12;i++){const c=sets[i%3];a.push(c[rnd(c.length)])}for(let i=a.length-1;i>0;i--){const j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a.join('')}

function mkSellerU(mk,ex){return mk?(SCM0().users||[]).find(u=>u.role=='seller'&&!u.off&&u.mk==mk&&u.id!=ex):null}
function dupSellers(){const M=SCM0(),C={};(M.users||[]).forEach(u=>{if(u.role=='seller'&&!u.off&&u.mk)(C[u.mk]=C[u.mk]||[]).push(u)});return Object.keys(C).filter(k=>C[k].length>1).map(k=>({mk:k,u:C[k]}))}

function mkLine(x){const t=String(x||'').replace(/\s+/g,' ').trim();if(!t)return null;const i=t.search(/[,،|\t]/);return i<0?{n:t,u:''}:{n:t.slice(0,i).trim(),u:t.slice(i+1).replace(/[,،|]/g,' ').replace(/\s+/g,' ').trim()}}
function mkNew(L){const M=SCM0(),ex=new Set((M.mkts||[]).map(m=>m.name.toLowerCase())),seen=new Set(),add=[],dup=[];L.map(mkLine).filter(x=>x&&x.n).forEach(x=>{const k=x.n.toLowerCase();if(ex.has(k)||seen.has(k))dup.push(x.n);else{seen.add(k);add.push(x)}});return{add,dup}}

const DEV=/[ऀ-ॿ]/,RUN=/[ऀ-ॿ]+(?:[  ]+[ऀ-ॿ]+)*/g;
const resc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
let M=new Map(),NX=null,sig='';
function nameEn(s,en){return en||(typeof toEn==='function'?toEn(s):s)}
const PURE_DEV=/^[ऀ-ॿ]+(?:[ \u00a0][ऀ-ॿ]+)*$/;
function build(){
  let s='';try{s=D.items.map(i=>i.name+(i.en||'')).join('|')+'#'+D.cust.map(c=>c.name+(c.alt||'')).join('|')+'#'+((D.mkts||[]).map(m=>m.name).join('|'))+'#'+((D.users||[]).map(u=>u.name).join('|'))}catch(e){}
  if(s===sig&&NX!==null)return;sig=s;

  M=new Map();const X=new Map();
  Object.keys(EN_UI).forEach(k=>{const v=EN_UI[k];if(v&&v!==k)(PURE_DEV.test(k)?M:X).set(k,v)});
  if(typeof BSM!=='undefined')BSM.forEach((m,i)=>M.set(m,BSE[i]));

  const dyn=new Map();
  try{
   D.items.forEach(i=>{if(DEV.test(i.name))dyn.set(i.name,nameEn(i.name,i.en))});
   D.cust.forEach(c=>{if(DEV.test(c.name))dyn.set(c.name,(c.alt&&!DEV.test(c.alt))?c.alt:nameEn(c.name))});
   ((S.M||D).mkts||[]).forEach(m=>{if(DEV.test(m.name))dyn.set(m.name,nameEn(m.name))});
   ((S.M||D).users||[]).forEach(u=>{if(DEV.test(u.name))dyn.set(u.name,nameEn(u.name))});
  }catch(e){}
  dyn.forEach((v,k)=>{if(k)(PURE_DEV.test(k)?M:X).set(k,v)});
  const keys=[...X.keys()].sort((a,b)=>b.length-a.length);
  NX=keys.length?{rx:new RegExp('(?<![\\u0900-\\u097F])(?:'+keys.map(resc).join('|')+')(?![\\u0900-\\u097F])','g'),m:X}:{rx:null,m:X};
}
function trRun(run){
 if(M.has(run))return M.get(run);
 const W=run.split(/[  ]+/);let out='',i=0;
 while(i<W.length){let hit=null;for(let j=W.length;j>i;j--){const k=W.slice(i,j).join(' ');if(M.has(k)){hit=[j,M.get(k)];break}}
  if(hit){out+=hit[1];i=hit[0]}else{out+=W[i];i++}
  if(i<W.length)out+=' '}
 return out}
function tr(s){
 if(lang!=='en'||!DEV.test(s))return s;
 build();
 if(NX.rx)s=s.replace(NX.rx,m=>NX.m.get(m));
 if(DEV.test(s))s=s.replace(RUN,trRun);
 return s.replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c))}

const SKIPT={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1};
function skip(p){return !p||SKIPT[p.tagName]||(p.closest&&p.closest('.bill,.notr'))}
function trText(n){
 const v=n.nodeValue;if(!DEV.test(v))return;const p=n.parentNode;if(skip(p))return;
 if(p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',v);
 const t=tr(v);if(t!==v)n.nodeValue=t}
const ATT=['placeholder','title','aria-label'];
function trNode(r){
 if(lang!=='en')return;
 if(r.nodeType===3){trText(r);return}
 if(r.nodeType!==1||SKIPT[r.tagName])return;
 if(r.closest&&r.closest('.bill,.notr'))return;
 const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;const L=[];while(n=w.nextNode())L.push(n);L.forEach(trText);
 const E=r.querySelectorAll?[r,...r.querySelectorAll('[placeholder],[title],[aria-label]')]:[r];
 E.forEach(e=>{if(e.closest&&e.closest('.bill,.notr'))return;ATT.forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v&&DEV.test(v)){const t=tr(v);if(t!==v)e.setAttribute(a,t)}})})}
const obs=new MutationObserver(ms=>{if(lang!=='en')return;ms.forEach(m=>{if(m.type==='characterData')trText(m.target);else m.addedNodes.forEach(trNode)})});

<script>
/* ===== बिदा र कभर (Seller Leave & Cover) — अलग मोड्युल: ५ अलग पेज =====
   लx (hub) · lv_new दर्ता · lv_cov कभर/बजार बन्द · lv_ord रोकिएका Order · lv_due बाँकी हस्तान्तरण · lv_rep इतिहास
   Data: M.lv = [{id,sid,mk,from,to,mode:'cover'|'hold',cov,why,st:'on'|'x'|'ret',mv,cx,hand}] */
(function(){
const M=()=>SCM0(),T=()=>today(),L=()=>(M().lv=M().lv||[]);
const ED=()=>roleKind()=='mgmt'&&!S.vr;
const UL=()=>M().users||[],SEL=()=>UL().filter(u=>u.role=='seller'&&!u.off);
const uN=id=>{const u=UL().find(x=>x.id==id);return u?u.name:'—'};
const DN=['आइतबार','सोमबार','मङ्गलबार','बुधबार','बिहीबार','शुक्रबार','शनिबार'],dowOf=d=>new Date(d+'T00:00:00Z').getUTCDay();
const onDay=(l,d)=>l.st=='on'&&l.from<=d&&d<=l.to&&(!l.dow||l.dow.includes(dowOf(d)));
const live=onDay;
const days=l=>Math.round((Date.parse(l.to)-Date.parse(l.from))/864e5)+1;
const per=l=>l.dow?'हरेक '+l.dow.map(i=>DN[i]).join(', ')+' · '+fd(l.from)+' देखि'+(l.to<'2099'?' '+fd(l.to)+' सम्म':''):fd(l.from)+' देखि '+fd(l.to)+' ('+days(l)+' दिन)';
const MIN=(a,b)=>a<b?a:b;
const back=(to,t)=>`<button class="b g" onclick="S.sub=${to?`'${to}'`:'null'};render()">← ${t||'पछाडि'}</button>`;
const stp=l=>l.st=='x'?'रद्द':l.st=='ret'?'फर्कियो':l.to<T()?(l.dow?'रोकियो':'सकियो'):l.from>T()?'आउँदै':(l.dow?'साप्ताहिक':'चालु');
const vis=l=>ED()||!S.u||l.sid==S.u.id||l.cov==S.u.id;
const cur=()=>{const A=L().filter(l=>l.st=='on'&&vis(l)).sort((a,b)=>a.from<b.from?1:-1);return A.find(l=>l.id==S.lvs)||A.find(l=>l.from<=T()&&T()<=l.to&&(!l.dow||l.dow.includes(dowOf(T()))))||A.find(l=>l.dow)||A[0]||null};
const mine=()=>S.u?L().filter(l=>l.st=='on'&&l.to>=T()&&(l.sid==S.u.id||l.cov==S.u.id)):[];
const warnTxt='<div class="warn">यो पेजमा परिवर्तन गर्न Admin / मार्केटिङ हेड चाहिन्छ।</div>';
const none='<div class="card s">कुनै बिदा दर्ता छैन — पहिले "बिदा दर्ता" बाट थप्नुहोस्।</div>';
const chips=()=>{const A=L().filter(l=>l.st=='on'&&vis(l)).sort((a,b)=>a.from<b.from?1:-1).slice(0,12),c=cur();return A.length?`<div style="display:flex;gap:6px;overflow-x:auto;margin:8px 0">${A.map(l=>`<button class="b ${c&&c.id==l.id?'':'g'}" style="white-space:nowrap;padding:8px 12px" onclick="S.lvs='${l.id}';render()">${esc(uN(l.sid))} · ${fd(l.from)}</button>`).join('')}</div>`:''};
const grantBox=l=>{const c=conn(),me=!!S.u&&S.u.id==l.sid,can=c&&(ED()||me),cands=SEL().filter(u=>u.id!=l.sid).concat(UL().filter(u=>u.role=='mkt'&&!u.off));
 return`<div class="card" style="border-left:5px solid ${grant(l)?'var(--a)':'var(--b)'}"><b>🔑 कभरलाई पूर्ण Permission</b><div class="s">Permission दिएपछि कभर विक्रेताले यो बजारका सबै इन्ट्री भएका Orderको Delivery र भुक्तानी गर्न सक्छ र ती हिसाबमा जोडिन्छन्। बिदामा बस्ने विक्रेताले भने कहिल्यै गर्न सक्दैन।</div>
 ${me&&!ED()?`<select style="width:100%;padding:10px;margin-top:8px" ${c?'':'disabled'} onchange="lvPick('${l.id}',this.value)"><option value="">— कभर विक्रेता छान्नुहोस् —</option>${cands.map(u=>`<option value="${u.id}" ${l.cov==u.id?'selected':''}>${esc(u.name)}${u.role=='mkt'?' (मार्केटिङ हेड)':''}</option>`).join('')}</select>`:''}
 <label style="display:flex;gap:10px;align-items:center;margin-top:10px"><input type="checkbox" style="width:22px;height:22px;flex:none" ${l.cvAll?'checked':''} ${can&&l.cov?'':'disabled'} onchange="lvGrant('${l.id}',this.checked)"><span>${l.cov?esc(uN(l.cov))+' लाई सबै Orderको Delivery/भुक्तानी Permission':'पहिले कभर विक्रेता तोक्नुहोस्'}</span></label>
 ${c?'':'<div class="warn" style="margin-top:8px">क्लाउड/API जोडिएको छैन — अहिले Permission दिन मिल्दैन। जोडिएपछि मात्र लागू हुन्छ; तबसम्म सबै Order सुरक्षित रहन्छन् र कसैले Delivery/भुक्तानी गर्न सक्दैन।</div>'}</div>`};
window.lvGrant=function(id,on){const l=byId(id);if(!l||!S.u&&!ED()||!conn()||!l.cov||!(ED()||(S.u&&S.u.id==l.sid)))return render();l.cvAll=!!on;log(`कभरलाई पूर्ण Permission ${on?'दिइयो':'फिर्ता भयो'}: ${uN(l.sid)} → ${uN(l.cov)}`);save();render();toast(on?'✓ Permission दिइयो':'Permission फिर्ता भयो')};
window.lvPick=function(id,v){const l=byId(id);if(!l||!S.u||!conn()||!(ED()||S.u.id==l.sid))return render();l.mode='cover';l.cov=v;l.cvAll=false;log(`कभर तोकियो: ${uN(l.sid)} को बजार → ${v?uN(v):'—'}`);save();render()};
const hdr=(l,t)=>`${back('lv','बिदा र कभर')}<h2 style="margin-top:8px">${t}</h2>${chips()}${l?`<div class="card"><b>${esc(uN(l.sid))}</b> · ${esc(mkName(l.mk)||'बजार छैन')}<div class="s">${per(l)} · ${stp(l)}</div></div>`:''}`;

/* ---- बजार-बन्द मोडले नियमित Order रोक्छ (onHold ले यही बोलाउँछ) ---- */
window.lvHold=function(c,d){try{return !!c&&L().some(l=>l.st=='on'&&l.mode=='hold'&&l.mk==c.mk&&onDay(l,d))}catch(e){return false}};

/* ---- Settingsमा देखिने ट्याइल ---- */
window.lvTile=function(){if(!(ED()||curRole()=='seller'))return'';const a=L().filter(l=>live(l,T())).length,m=mine().length;
 return`<div class="card stl" style="--h:35" role="button" onclick="S.sub='lv';S.hub=null;render()"><span class="sti">${icn('clock')}</span><div class="stx"><b>बिदा र कभर</b><div class="s">${ED()?(a?a+' विक्रेता आज बिदामा':'आज कोही बिदामा छैन'):((m||unseenN())?(m?'तपाईंको '+m+' बिदा/कभर':'')+(unseenN()?(m?' · ':'')+unseenN()+' नयाँ बाँकी Entry':''):'बिदा/कभर छैन')}</div></div><span class="s">›</span></div>`};

/* ---- मुख्य राउटर: setV ले बोलाउँछ ---- */
window.lvPage=function(t){
 if(!ED()&&curRole()!='seller'){return null}
 if(t=='lv')return hub();
 if(!ED())return t=='lv_due'&&curRole()=='seller'?pDue():hub();
 return({lv_new:pNew,lv_cov:pCov,lv_ord:pOrd,lv_due:pDue,lv_rep:pRep}[t]||hub)()};

/* ================= हब (सुरुको पेज) ================= */
function hub(){const A=L().filter(l=>l.st=='on'&&l.to>=T()),rows=ED()?'':sellerBox();
 const n=k=>L().filter(l=>l.st=='on'&&l.to>=T()&&k(l)).length;
 const tl=(k,ic,ti,su)=>`<div class="card stl" style="--h:150" role="button" onclick="S.sub='${k}';render()"><span class="sti">${ic}</span><div class="stx"><b>${ti}</b><div class="s">${su}</div></div><span class="s">›</span></div>`;
 return`${back(null,'Settings')}<h2>बिदा र कभर</h2><div class="s">विक्रेता बिदा बस्दा बजार, Order र बाँकी कसरी चल्छ भन्ने व्यवस्थापन — प्रत्येक काम अलग पेजमा।</div>${rows}${ED()?`
 ${tl('lv_new','🗓️','१. बिदा दर्ता','विक्रेता, मिति, कारण')}
 ${tl('lv_cov','🔁','२. कभर / बजार बन्द',n(l=>l.mode=='cover'&&!l.cov)?`<span class="neg">${n(l=>l.mode=='cover'&&!l.cov)} मा कभर तोकिएको छैन</span>`:'को कभर गर्ने, वा बजार बन्द')}
 ${tl('lv_ord','📦','३. रोकिएका Order','सुरक्षित Order — कभरको नाममा सार्ने / रद्द')}
 ${tl('lv_due','💰','४. बाँकी रकम हस्तान्तरण','पुरानो बाँकी उठेको · नयाँ बाँकी — खाता Entry')}
 ${tl('lv_rep','📊','५. बिदा इतिहास','सबै बिदा र नतिजा')}`:''}
 ${A.length&&ED()?'':''}`}

function sellerBox(){if(!S.u)return'';const m=mine(),own=S.u.mk,at=S.sc||own||'';
 let h=m.length?m.map(l=>{const me=l.sid==S.u.id,cv=l.cov==S.u.id,ok=cv&&live(l,T());
  return`<div class="card"><b>${me?'तपाईंको बिदा':'कभर: '+esc(mkName(l.mk))}</b><div class="s">${per(l)} · ${me?(l.mode=='hold'?'बजार बन्द':'कभर: '+esc(l.cov?uN(l.cov):'तोकिएको छैन')):esc(uN(l.sid))+' को बजार'}</div>${ok?(at==l.mk?'<div class="ok" style="margin-top:6px">✓ अहिले यही बजार खुला छ</div>':`<button class="b" style="width:100%;margin-top:8px" onclick="lvGo('${l.mk}')">यो बजार खोल्नुहोस्</button>`):cv?'<div class="s">कभर '+fd(l.from)+' देखि सुरु</div>':''}${cv&&!me?(grant(l)?'<div class="ok" style="margin-top:6px">✓ तपाईंलाई यो बजारका सबै Orderको Delivery/भुक्तानी Permission छ</div>':'<div class="s" style="margin-top:6px">'+(conn()?'पूर्ण Permission छैन — सारिएका Order मात्र गर्न सक्नुहुन्छ':'क्लाउड/API जोडिएको छैन — अहिले Delivery/भुक्तानी गर्न मिल्दैन')+'</div>'):''}${me&&l.mode=='cover'?grantBox(l):''}${lvBox(l)}</div>`}).join(''):'<div class="card s">अहिले तपाईंको कुनै बिदा वा कभर छैन।</div>';
 if(own&&at!=own&&m.length)h+=`<button class="b g" style="width:100%" onclick="lvGo('${own}')">आफ्नो बजारमा फर्कनुहोस्</button>`;
 return h+L().filter(l=>l.st=='on'&&l.to<T()&&(l.sid==S.u.id||l.cov==S.u.id)&&unseenOf(l)>0).map(l=>`<div class="card"><b>${esc(uN(l.sid))} को बिदा</b><div class="s">${per(l)}</div>${lvBox(l)}</div>`).join('')}
window.lvGo=function(mk){if(!S.u)return;const ok=mk==S.u.mk||L().some(l=>live(l,T())&&l.mode=='cover'&&l.cov==S.u.id&&l.mk==mk);if(!ok)return toast('कभर अवधि छैन — खोल्न मिल्दैन');scopeTo(mk||null);S.tab=0;S.sub=null;S.cid=null;render();toast(mk==S.u.mk?'आफ्नो बजार':'कभर: '+mkName(mk))};

/* ================= पेज १: बिदा दर्ता ================= */
function pNew(){const t=T(),S0=SEL();
 const lst=L().filter(l=>l.st=='on'&&l.to>=t).sort((a,b)=>a.from<b.from?-1:1).map(l=>`<div class="card"><div class="row"><b>${esc(uN(l.sid))}</b><span class="pill n">${stp(l)}</span></div><div class="s">${esc(mkName(l.mk))} · ${per(l)}${l.why?' · '+esc(l.why):''}</div><div class="row" style="gap:6px;margin-top:8px">${l.dow?'':`<button class="b g" style="flex:1;padding:8px" onclick="lvExt('${l.id}')">+१ दिन</button>`}${l.from<=t?`<button class="b g" style="flex:1;padding:8px" onclick="lvRet('${l.id}')">${l.dow?'यो नियम रोक्ने':'फर्कियो'}</button>`:''}<button class="b d" style="flex:1;padding:8px" onclick="lvDel('${l.id}')">रद्द</button></div></div>`).join('');
 return`${back('lv','बिदा र कभर')}<h2 style="margin-top:8px">१. बिदा दर्ता</h2>
 <div class="card"><label class="s">विक्रेता</label><select id="ls" style="width:100%;padding:10px;margin:4px 0 8px">${S0.map(u=>`<option value="${u.id}">${esc(u.name)}${u.mk?' · '+esc(mkName(u.mk)):' · बजार छैन'}</option>`).join('')}</select>
 <div class="aseg" style="margin:4px 0 8px"><button id="lk0" class="on" onclick="lvKind(0)">मिति अवधि</button><button id="lk1" onclick="lvKind(1)">साप्ताहिक बिदा</button></div><div id="lwk" style="display:none;margin-bottom:8px"><div class="s">हरेक हप्ता यी दिन बिदा:</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${DN.map((n,i)=>`<label class="s" style="display:flex;gap:4px;align-items:center;border:1px solid var(--b);border-radius:10px;padding:6px 8px"><input type="checkbox" class="lwd" value="${i}" style="width:18px;height:18px">${n}</label>`).join('')}</div></div><div class="row" style="gap:8px"><div style="flex:1"><label class="s">देखि</label><input type="date" id="lf" value="${t}"></div><div style="flex:1" id="ltw"><label class="s">सम्म</label><input type="date" id="lt" value="${t}"></div></div>
 <label class="s" style="display:block;margin-top:8px">कारण</label><select id="lw" style="width:100%;padding:10px;margin:4px 0"><option>बिरामी</option><option>चाडपर्व</option><option>व्यक्तिगत काम</option><option>अन्य</option></select>
 <div class="s">दर्ता गरेपछि "कभर / बजार बन्द" पेजमा कसले सम्हाल्ने तोक्नुहोस्।</div><button class="b" style="width:100%;margin-top:10px" onclick="lvAdd()">बिदा दर्ता गर्नुहोस्</button></div>${lst||''}`}
window.lvKind=function(k){S.lk=k;$('#lk0').className=k?'':'on';$('#lk1').className=k?'on':'';$('#lwk').style.display=k?'block':'none';$('#ltw').style.display=k?'none':'block'};
window.lvAdd=function(){if(!ED())return;const wk=S.lk==1,sid=$('#ls').value,f=$('#lf').value,to=wk?'2099-12-31':$('#lt').value,u=UL().find(x=>x.id==sid),dw=wk?[...document.querySelectorAll('.lwd:checked')].map(x=>+x.value):null;
 if(wk&&!dw.length)return toast('कम्तीमा एक दिन छान्नुहोस्');
 if(!u||!f||!to)return toast('विक्रेता र मिति भर्नुहोस्');if(to<f)return toast('"सम्म" मिति "देखि" भन्दा अघि हुन सक्दैन');
 if(!u.mk)return alert('यो विक्रेतालाई बजार तोकिएको छैन — पहिले User र पदबाट बजार तोक्नुहोस्।');
 if(L().some(l=>l.sid==sid&&l.st=='on'&&!(to<l.from||f>l.to)&&(wk?(l.dow&&l.dow.some(x=>dw.includes(x))):!l.dow)))return alert('यो विक्रेताको बिदा यी मितिसँग मिल्दोजुल्दो पहिल्यै दर्ता छ।');
 const l={id:uid(),sid,mk:u.mk,from:f,to,mode:'cover',cov:'',why:wk?'साप्ताहिक बिदा':$('#lw').value,st:'on',mv:0,cx:0,ts:Date.now(),by:S.u?S.u.name:''};if(wk)l.dow=dw;
 L().push(l);S.lvs=l.id;log(`बिदा दर्ता: ${u.name} ${wk?'साप्ताहिक':f+' देखि '+to}`);save();S.sub='lv_cov';render();toast('बिदा दर्ता भयो — अब कभर तोक्नुहोस्')};
const byId=id=>L().find(x=>x.id==id);
window.lvExt=function(id){const l=byId(id);if(!l||!ED())return;l.to=skAdd(l.to,1);log('बिदा थपियो: '+uN(l.sid)+' → '+l.to);save();render()};
window.lvRet=function(id){const l=byId(id);if(!l||!ED()||!confirm(l.dow?uN(l.sid)+' को साप्ताहिक बिदा आजदेखि रोक्ने? (अघिल्ला बिदाका दिन जस्ताको तस्तै रहन्छन्)':uN(l.sid)+' आजै फर्किए? बिदा आजसम्म बन्द हुन्छ।'))return;if(l.dow){l.to=skAdd(T(),-1);if(l.to<l.from)l.st='x';log('साप्ताहिक बिदा रोकियो: '+uN(l.sid));save();render();return}l.to=T();l.st=l.from>l.to?'x':'ret';log('बिदाबाट फर्कियो: '+uN(l.sid));save();render()};
window.lvDel=function(id){const l=byId(id);if(!l||!ED()||!confirm('यो बिदा रद्द गर्ने? (इतिहासमा देखिन्छ)'))return;l.st='x';log('बिदा रद्द: '+uN(l.sid));save();render()};

/* ================= पेज २: कभर / बजार बन्द ================= */
function pCov(){const l=cur();if(!l)return`${back('lv','बिदा र कभर')}<h2>२. कभर / बजार बन्द</h2>${none}`;
 const cands=SEL().filter(u=>u.id!=l.sid&&!L().some(x=>x.st=='on'&&x.sid==u.id&&!(l.to<x.from||l.from>x.to))),
 mgr=UL().filter(u=>u.role=='mkt'&&!u.off),opt=cands.concat(mgr),
 ncv=cid=>L().filter(x=>x.st=='on'&&x.cov==cid&&x.id!=l.id&&!(l.to<x.from||l.from>x.to)).length;
 return`${hdr(l,'२. कभर / बजार बन्द')}

function pEnts(l){const ids=new Set(M().cust.filter(c=>c.mk==l.mk).map(c=>c.id)),e2=MIN(l.to,T());
 return M().ent.filter(e=>!e.void&&e.status=='order'&&ids.has(e.cid)&&e.date>=l.from&&e.date<=e2&&onDay(l,e.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function pOrd(){const l=cur();if(!l)return`${back('lv','बिदा र कभर')}<h2>३. रोकिएका Order</h2>${none}`;
 const E=pEnts(l),q=e=>rn(e.lines.reduce((s,x)=>s+(+x.q||0),0)),can=conn()&&l.mode=='cover'&&l.cov&&!l.cvAll,cn=l.cov?uN(l.cov):'',nm=E.filter(e=>!e.mvTo).length;
 const dup={};E.forEach(e=>dup[e.cid]=(dup[e.cid]||0)+1);

 return`${hdr(l,'३. रोकिएका Order')}<div class="s">बिदाका दिनका Order जस्ताको तस्तै सुरक्षित रहन्छन् र नयाँ Order दर्ता/सम्पादन गर्न मिल्छ। ती हिसाब (बिक्री, बाँकी, Dispatch, दिन Close) मा जोडिँदैनन् र अर्को दिनको नियमित प्रक्रियामा असर पर्दैन। बिदामा बस्ने विक्रेताले कुनै अवस्थामा Delivery/भुक्तानी गर्न सक्दैन। कभरले गर्न सक्ने भनेको क्लाउड/API जोडिएको अवस्थामा मात्र हो — Admin वा बिदामा बस्ने विक्रेताले \"कभरलाई पूर्ण Permission\" दिए सबै Order, नदिए सार्न चाहेका Order मात्र।</div>${!conn()&&l.mode=='cover'?'<div class="warn">क्लाउड/API जोडिएको छैन — अहिले कसैले पनि Delivery/भुक्तानी गर्न सक्दैन, सार्न/Permission दिन पनि मिल्दैन। Order यथावत सुरक्षित रहन्छन्।</div>':''}

window.lvAll=function(){const l=cur();if(!l||!ED()||!conn()||l.mode!='cover'||!l.cov)return;const E=pEnts(l).filter(e=>!e.mvTo);if(!E.length)return;
 if(!confirm(E.length+' Order '+uN(l.cov)+' को नाममा सार्ने? (यो विक्रेताको स्क्रिनमा पनि देखिइरहन्छ, तर Delivery/भुक्तानी कभरले मात्र गर्छ)'))return;let bad=0;
 E.forEach(e=>{if(setMv(e,l,l.cov))bad++});log('बिदाका Order सामूहिक सारियो: '+uN(l.sid)+' → '+uN(l.cov)+' ('+(E.length-bad)+')');save();render();toast(bad?bad+' मिलेनन्':'✓ सकियो')};

/* ================= पेज ४: बाँकी रकम — खाता Entry र हस्तान्तरण =================
   बिदाको अवधिमा उठेको पुरानो बाँकी / भएको नयाँ बाँकी: असली Entry (e.lvl=बिदा id) बनाइन्छ,
   त्यसैले Customerको बाँकी, दिनको हिसाब, नगद र Reportमा आफैँ मिल्छ। e.other=नयाँ बिक्री, e.recv=कुल प्राप्त, e.lvOld=त्यसमध्ये पुरानो बाँकी। */
const lvlOf=l=>M().ent.filter(e=>e.lvl==l.id&&!e.void).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
const canAdd=l=>!!l&&l.st=='on'&&(ED()||(!!S.u&&(S.u.id==l.sid||S.u.id==l.cov)));
const canEd=e=>ED()||(!!S.u&&e.lvU==S.u.id);
const sp=e=>{const o=roundMoney(+e.lvOld||0),r1=roundMoney((+e.recv||0)-o),s0=roundMoney(+e.other||0);return{s:s0,r1,o,nd:roundMoney(s0-r1)}};
const unseenOf=l=>{if(!S.u)return 0;const t=(l.seen||{})[S.u.id]||0;return lvlOf(l).filter(e=>e.lvU!=S.u.id&&(e.ts||0)>t).length};
const unseenN=()=>S.u?L().filter(l=>l.st=='on'&&(l.sid==S.u.id||l.cov==S.u.id)).reduce((n,l)=>n+unseenOf(l),0):0;
const lvBox=l=>{const n=lvlOf(l).length,u=unseenOf(l);return`<button class="b ${u?'':'g'}" style="width:100%;margin-top:8px" onclick="lvOpenDue('${l.id}')">💰 बाँकी रकम खाता · ${n} Entry${u?' · <b>'+u+' नयाँ</b>':''}</button>`};
window.lvOpenDue=function(id){const l=byId(id);if(!l||!S.u)return;S.lvs=id;(l.seen=l.seen||{})[S.u.id]=Date.now();save();S.sub='lv_due';S.hub=null;render()};
const cbal=c=>{const cu=M().cust.find(x=>x.id==c)||{};return fromPaisa(M().ent.filter(e=>e.cid==c&&isCompleted(e)).reduce((t,e)=>t+dueOf(e),toPaisa(cu.open)))};
const cname=id=>(M().cust.find(c=>c.id==id)||{name:'?'}).name;
function pDue(){const l=cur();if(!l)return`${back('lv','बिदा र कभर')}<h2>४. बाँकी रकम</h2>${none}`;
 if(S.u&&!ED()){(l.seen=l.seen||{})[S.u.id]=Date.now()}
 const C=M().cust.filter(c=>c.mk==l.mk&&!c.hide),ids=new Set(C.map(c=>c.id)),e2=MIN(l.to,T());
 const B=C.map(c=>({c,b:cbal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b),tb=B.reduce((s,x)=>s+x.b,0);
 const E=M().ent.filter(e=>!e.void&&e.status!=='order'&&ids.has(e.cid)&&e.date>=l.from&&e.date<=e2&&onDay(l,e.date));
 let sale=0,rec=0,nd=0;const by={};E.forEach(e=>{const b=billTotal(e),r=+e.recv||0;sale+=b;rec+=r;const d=fromPaisa(dueOf(e));if(d>0)nd+=d;const k=e.by||'—';by[k]=(by[k]||0)+r});
 const cn=l.cov?uN(l.cov):'',cr=cn?by[cn]||0:0,LL=lvlOf(l);
 let tS=0,tR1=0,tO=0,tND=0,tAD=0;LL.forEach(e=>{const x=sp(e);tS+=x.s;tR1+=x.r1;tO+=x.o;if(x.nd>0)tND+=x.nd;else tAD-=x.nd});tND=roundMoney(tND);tAD=roundMoney(tAD);
 const rows=LL.map(e=>{const x=sp(e);
  return`<div class="card"><div class="row"><b>${esc(cname(e.cid))}</b><span class="s">${fd(e.date)}</span></div>
  <div class="s">नयाँ बिक्री रु ${n2(x.s)} · त्यसमा प्राप्त रु ${n2(x.r1)}</div>
  <div class="row" style="margin-top:4px"><span class="${x.nd>0?'neg':x.nd<0?'ok':'s'}">${x.nd<0?'बढी प्राप्त (अग्रिम) + रु '+n2(-x.nd):'नयाँ बाँकी '+(x.nd>0?'+ रु '+n2(x.nd):'—')}</span><span class="${x.o>0?'ok':'s'}">पुरानो बाँकी ${x.o>0?'− रु '+n2(x.o)+' उठ्यो':'—'}</span></div>
  <div class="s" style="margin-top:4px">अहिले Customerको बाँकी रु ${n2(cbal(e.cid))} · Entry: ${esc(e.lvBy||'—')}${e.note?' · '+esc(e.note):''}</div>
  ${canEd(e)&&!locked(e.date)?`<div class="row" style="gap:6px;margin-top:8px"><button class="b g" style="flex:1;padding:8px" onclick="lvlForm('${l.id}','${e.id}')">सच्याउने</button><button class="b d" style="flex:1;padding:8px" onclick="lvlVoid('${e.id}')">रद्द</button></div>`:locked(e.date)?'<div class="s">🔒 दिन बन्द भइसकेको छ</div>':''}</div>`}).join('');
 return`${hdr(l,'४. बाँकी रकम — खाता Entry')}
 <div class="card"><div class="row"><span>उठाउने (कभर)</span><b>${l.mode=='hold'?'बजार बन्द':cn?esc(cn):'<span class="neg">तोकिएको छैन</span>'}</b></div><div class="row"><span>बजारको अहिलेको बाँकी</span><b class="neg">रु ${n2(tb)}</b></div><div class="s">${B.length} Customerको बाँकी छ। बिदाको अवधिमा पुरानो बाँकी उठे/नयाँ बाँकी भए तल Entry गर्नुहोस् — Customerको बाँकी र दिनको हिसाबमा आफैँ मिल्छ।</div></div>
 ${canAdd(l)?`<button class="b" style="width:100%;margin:8px 0" onclick="lvlForm('${l.id}')">+ बाँकी रकम Entry थप्नुहोस्</button>`:''}
 <div class="card"><b>बिदाको खाता (Entry ${LL.length})</b><div class="row"><span>नयाँ बिक्री</span><b>रु ${n2(tS)}</b></div><div class="row"><span>नयाँ बिक्रीमा प्राप्त</span><b class="ok">रु ${n2(tR1)}</b></div><div class="row"><span>नयाँ बाँकी (बढ्यो)</span><b class="neg">+ रु ${n2(tND)}</b></div><div class="row"><span>पुरानो बाँकी उठेको (घट्यो)</span><b class="ok">− रु ${n2(tO)}</b></div>${tAD>0?`<div class="row"><span>बढी प्राप्त — अग्रिम (घट्यो)</span><b class="ok">− रु ${n2(tAD)}</b></div>`:''}<div class="row" style="border-top:1px dashed var(--b);margin-top:4px;padding-top:4px"><span>बजारको बाँकीमा कुल असर</span><b class="${tND-tO-tAD>0?'neg':'ok'}">${tND-tO-tAD>0?'+':tND-tO-tAD<0?'−':''} रु ${n2(Math.abs(roundMoney(tND-tO-tAD)))}</b></div></div>
 ${rows||'<div class="card s">अहिलेसम्म कुनै खाता Entry छैन।</div>'}
 <div class="card"><b>बिदा अवधिमा (आजसम्म) — सबै Entry</b><div class="row"><span>बिक्री</span><b>रु ${n2(sale)}</b></div><div class="row"><span>प्राप्त</span><b class="ok">रु ${n2(rec)}</b></div><div class="row"><span>नयाँ बाँकी (यसै अवधिको)</span><b class="neg">रु ${n2(nd)}</b></div>

 ${!ED()?'':l.hand?`<div class="card ok">✓ हस्तान्तरण पूरा — ${esc(l.hand.t)} · ${esc(l.hand.by)} · कभरले उठाएको रु ${n2(l.hand.amt)}</div>`:`<button class="b" style="width:100%;margin-top:10px" onclick="lvHand(${cr})">बिदा सकिएपछि हस्तान्तरण पूरा भयो</button><div class="s">कभरले उठाएको नगद बुझिसकेपछि मात्र थिच्नुहोस्।${l.to>=T()?' (बिदा अझै चालु छ)':''}</div>`}`}
window.lvHand=function(amt){const l=cur();if(!l||!ED())return;if(!confirm('कभरले उठाएको रु '+n2(amt)+' बुझियो र हस्तान्तरण पूरा भयो?'))return;l.hand={t:nowT(),by:S.u?S.u.name:'',amt};log('बिदा हस्तान्तरण पूरा: '+uN(l.sid)+' · रु '+n2(amt));save();render()};

<script>

   विक्रेताको गन्ती पहिल्यै भएको M.cash.d[मिति][बजार] बाटै आउँछ — दोहोरो Entry छैन। */
(function(){

 if(!a.length)return[{id:'',name:(M.biz&&M.biz.name)||'सबै'}];
 let L=o!==null?a.filter(x=>x.id==o):a.slice();
 if(o!==null&&!L.length)L=[{id:'',name:'बजार तोकिएको छैन'}];
 else if(o===null&&M.cust.some(c=>!c.mk))L.push({id:'',name:'बजार तोकिएको छैन'});
 if(S.sc&&o===null)L=L.filter(x=>x.id==S.sc);
 return L}

/* Customerको खाताबाट एकपटक बनाइने सूचकाङ्क (LC सँगै हरेक save/render मा रिसेट) */
function idx(){if(LC['~cs'])return LC['~cs'];const M=M0(),cm={},dm={},by={};
 M.cust.forEach(c=>{cm[c.id]={mk:c.mk||'',open:P(c.open),c}});
 M.ent.forEach(e=>{if(e.void||!isCompleted(e))return;const c=cm[e.cid];if(!c)return;
  let t=0;try{t=P(billTotal(e))}catch(x){}const r=P(e.recv),k=e.date+'|'+c.mk,o=dm[k]||(dm[k]={ts:0,tr:0});

 return{ts:o.ts,tr:o.tr,old,exp:old+o.ts,close,ow,av}}

/* विक्रेता खाता = Σ(बुझाएको नगद − दिनको जम्मा बिक्री/सामान) ; बजारमा बाँकी = Dr, बढी नगद = Cr ·  + चुक्ता/माफी/फर्काइ ; ऋण = कम, धन = बढी */
function acct(mk){const M=M0(),I=idx(),ds=new Set(),rows=[],pend=[],td=today();let bal=0;

  if(g.h===null){if(tr>0&&d<td)pend.push({d,tr});return}

  if(b>0){ow+=b;L.push({n:c.c.name,b});if(c.c.prom&&c.c.prom<=td)od++}else if(b<0)av-=b}
