function lgParse(x){let m=String(x.m||''),tag='',iv='';const P='हस्तक्षेप · ';if(m.startsWith(P)){iv=1;m=m.slice(P.length)}const t=m.match(/^\[([^\]]*)\]\s*/);if(t){tag=t[1];m=m.slice(t[0].length)}const k=m.indexOf(': ');const v=k>0?m.slice(0,k):m,r=k>0?m.slice(k+2):'';let nm=r,dt='',tail='';const d=r.match(/\d{4}-\d{2}-\d{2}/);if(d){nm=r.slice(0,d.index).trim();dt=d[0];tail=r.slice(d.index+dt.length).trim()}let det=tail,amt='';const a=tail.match(/^([+−-]\s?[\d,.]+)$/);if(a){amt=a[1];det=''}else if(tail.startsWith('—'))det=tail.slice(1).trim();return{tag,iv,v,nm,dt,det,amt}}
function lgIc(v){return/भुक्तानी|रकम प्राप्ति|असुली/.test(v)?['💰','g']:/डेलिभरी/.test(v)?['🚚','b']:/सच्या|संशोधन|परिवर्तन/.test(v)?['✏️','y']:/अर्डर/.test(v)?['🛒','b']:/रेट/.test(v)?['🏷️','y']:/मेट|हटा/.test(v)?['🗑️','r']:/लगइन/.test(v)?['🔑','b']:['•','n']}
function lgRow(x,full){const p=lgParse(x),ic=lgIc(p.v),tm=String(x.t||'').split(' ').slice(1).join(' '),meta=full?[p.dt?'अर्डर '+p.dt:'',p.tag].filter(Boolean).join(' · '):'';return`<div class="lr"><span class="li ${ic[1]}">${ic[0]}</span><div class="lb" onclick="this.classList.toggle('ex')"><div class="l1">${p.nm?'<b>'+esc(p.nm)+'</b> ':''}<span class="lv">${esc(p.v)}</span>${p.iv?' <em class="lt2">हस्तक्षेप</em>':''}</div>${p.det?'<div class="l2">'+esc(p.det)+'</div>':''}${meta?'<div class="l3">'+esc(meta)+'</div>':''}</div><div class="lc">${p.amt?'<b class="la '+(p.amt[0]=='+'?'ok':'neg')+'">'+esc(p.amt)+'</b>':''}<small>${esc(tm)}</small></div></div>`}
function lgList(A,full){const td=nowT().split(' ')[0];let last=null,h='';A.forEach(x=>{const d=String(x.t||'').split(' ')[0];if(d!==last){last=d;h+='<div class="lh">'+(d==td?'आज':esc(d))+'</div>'}h+=lgRow(x,full)});return h}

const PW_MIN=8,PW_ITER=150000,
PW_MSG='पासवर्ड कम्तीमा ८ अक्षरको हुनुपर्छ र अक्षर तथा अङ्क दुवै हुनुपर्छ',
NOCRYPTO='यो ब्राउजरमा सुरक्षित पासवर्ड सुविधा उपलब्ध छैन। एपलाई HTTPS ठेगानाबाट खोल्नुहोस्',
pwOk=p=>typeof p==='string'&&p.length>=PW_MIN&&p.length<=64&&/[A-Za-z\u0904-\u0939]/.test(p)&&/[0-9\u0966-\u096F]/.test(p),
b64e=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},
b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
ceq=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
async function pbk(pw,salt,it){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256))}
async function hashPw(pw){const s=crypto.getRandomValues(new Uint8Array(16));return 'p2$'+PW_ITER+'$'+b64e(s)+'$'+b64e(await pbk(pw,s,PW_ITER))}
async function verPw(pw,st){if(typeof st!=='string'||st.indexOf('p2$')!==0)return false;const p=st.split('$');if(p.length!==4)return false;const it=+p[1];if(!(it>=1e5&&it<=1e6))return false;return ceq(await pbk(pw,b64d(p[2]),it),b64d(p[3]))}

function genPw(){const sets=['abcdefghjkmnpqrstuvwxyz','ABCDEFGHJKLMNPQRSTUVWXYZ','23456789'],a=[];for(let i=0;i<12;i++){const c=sets[i%3];a.push(c[rnd(c.length)])}for(let i=a.length-1;i>0;i--){const j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a.join('')}

   const okDel=confirm('यो फोनमा '+delK.length+' रेकर्ड हराएको देखियो (ब्याकअप फर्काउँदा / नयाँ अध्याय गर्दा यस्तो हुन्छ)।\n\nOK = क्लाउडबाट पनि सबैतिर मेट्ने\nCancel = मेट्ने होइन, क्लाउडबाट फिर्ता ल्याउने');

${tab=='b'?binH():`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">${KF.map(([k,l])=>`<button class="b ${(S.audK||'')==k?'':'g'}" style="padding:6px 10px;font-size:13px" onclick="S.audK='${k}';S.audN=40;render()">${l}</button>`).join('')}</div><input placeholder="नाम वा व्यक्ति खोज्नुहोस्" value="${esc(S.audQ||'')}" oninput="S.audQ=this.value;S.audN=40;document.getElementById('audl').innerHTML=audList()" style="margin-bottom:6px"><div id="audl">${listH()}</div>`}`};

const SW_SRC="const V = 'dairy-hisab-v1';\nconst PREFIX = 'dairy-hisab-';\nconst SCOPE = self.registration.scope;\nconst CORE = [SCOPE, SCOPE + 'index.html'];\nconst MK = SCOPE + '__upd';\nconst keyOf = (u) => { const x = new URL(u); x.hash = ''; x.search = ''; return x.href; };\nasync function clean(res) {\n  if (!res.redirected) return res;\n  const b = await res.blob();\n  return new Response(b, { status: 200, statusText: 'OK', headers: res.headers });\n}\nasync function tell(msg) {\n  const cs = await self.clients.matchAll({ includeUncontrolled: true });\n  cs.forEach((c) => { try { c.postMessage(msg); } catch (e) {} });\n}\nself.addEventListener('install', (e) => {\n  e.waitUntil((async () => {\n    const c = await caches.open(V);\n    await Promise.all(CORE.map(async (u) => {\n      try {\n        const r = await fetch(u, { cache: 'reload' });\n        if (r && r.ok && r.type === 'basic') await c.put(u, await clean(r));\n      } catch (err) {  }\n    }));\n    self.skipWaiting();\n  })());\n});\nself.addEventListener('activate', (e) => {\n  e.waitUntil((async () => {\n    let hadOld = false;\n    for (const k of await caches.keys()) {\n      if (k.indexOf(PREFIX) === 0 && k !== V) { hadOld = true; await caches.delete(k); }\n    }\n    await self.clients.claim();\n    if (hadOld) tell({ t: 'sw-upd' });\n  })());\n});\nself.addEventListener('message', (e) => {\n  if (!e.data) return;\n  if (e.data.t === 'skip') self.skipWaiting();\n  if (e.data.t === 'off') self.__off = true;\n  if (e.data.t === 'chk') {\n    const src = e.source;\n    e.waitUntil((async () => {\n      if (self.__off || !(await caches.has(V))) return;\n      const c = await caches.open(V);\n      if (await c.match(MK)) { try { src.postMessage({ t: 'sw-upd' }); } catch (err) {} }\n    })());\n  }\n});\nself.addEventListener('fetch', (e) => {\n  const r = e.request;\n  if (self.__off) return;\n  if (r.method !== 'GET') return;\n  if (r.headers.get('range')) return;\n  const u = new URL(r.url);\n  if (u.origin !== self.location.origin) return;\n  if (u.pathname.endsWith('/sw.js')) return;\n  if (r.mode === 'navigate') {\n    e.respondWith((async () => {\n      const c = await caches.open(V);\n      const k = keyOf(r.url);\n      const was = await c.match(MK);\n      if (was) await c.delete(MK);\n      const hit = (await c.match(k)) || (await c.match(SCOPE)) || (await c.match(SCOPE + 'index.html'));\n      const oldCopy = hit ? hit.clone() : null;\n      const upd = fetch(r.url, { cache: 'no-cache' }).then(async (res) => {\n        if (res && res.ok && res.type === 'basic') {\n          const fresh = await clean(res);\n          let changed = false;\n          if (oldCopy) {\n            try { changed = (await oldCopy.text()) !== (await fresh.clone().text()); } catch (err) {}\n          }\n          await c.put(k, fresh.clone());\n          if (changed) { await c.put(MK, new Response('1')); tell({ t: 'sw-upd' }); }\n          return fresh;\n        }\n        return null;\n      }).catch(() => null);\n      if (hit) { e.waitUntil(upd); return hit; }\n      const net = await upd;\n      if (net) return net;\n      return new Response('अफलाइन — एप अहिलेसम्म यो फोनमा सुरक्षित भएको छैन। एकपटक इन्टरनेट खोलेर यो पेज खोल्नुहोस्।',\n        { status: 503, headers: { 'Content-Type': 'text/plain; charset=utf-8' } });\n    })());\n    return;\n  }\n  e.respondWith((async () => {\n    const c = await caches.open(V);\n    const hit = await c.match(r);\n    const upd = fetch(r).then(async (res) => {\n      if (res && res.ok && res.type === 'basic') await c.put(r, res.clone());\n      return res;\n    }).catch(() => null);\n    if (hit) { e.waitUntil(upd); return hit; }\n    return (await upd) || new Response('', { status: 504 });\n  })());\n});\n";
const envOk=()=>/^https:|^http:\/\/localhost|^http:\/\/127\.0\.0\.1/.test(location.href);
const SC=()=>new URL('./',location.href).href;
let SWERR='',REG=null;
async function swApply(){
 if(!('serviceWorker' in navigator))return;
 try{
  if(feat('sw')){
   if(!envOk()){SWERR='यो ठेगाना (file:// वा सुरक्षित नभएको http) मा Service Worker चल्दैन — https होस्टिङ चाहिन्छ';return}
   REG=await navigator.serviceWorker.register('sw.js',{scope:SC()});SWERR='';
   navigator.serviceWorker.ready.then(r=>setTimeout(()=>{try{if(r.active&&feat('sw'))r.active.postMessage({t:'chk'})}catch(e){}},1500)).catch(()=>{});
   try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  }else{
   const r=await navigator.serviceWorker.getRegistration(SC());
   if(r&&/\/sw\.js(\?|$)/.test((r.active||r.waiting||r.installing||{scriptURL:''}).scriptURL||'')){try{(r.active||r.waiting||r.installing).postMessage({t:'off'})}catch(e){}await r.unregister();if(window.caches)for(const k of await caches.keys())if(k.indexOf('dairy-hisab-')===0)await caches.delete(k)}
   REG=null;SWERR=''}
 }catch(e){SWERR=String((e&&e.message)||e)}}
function updBanner(){if(document.getElementById('swb'))return;const d=document.createElement('div');d.id='swb';
 d.style.cssText='position:fixed;left:8px;right:8px;bottom:84px;background:#0f6e56;color:#fff;padding:12px 14px;border-radius:12px;z-index:30;display:flex;gap:10px;align-items:center;font-size:14px';
 d.innerHTML='<span style="flex:1">एपको नयाँ संस्करण तयार छ।</span><button id="swr" style="padding:6px 12px;border-radius:8px;border:0;background:#fff;color:#0f6e56;font-weight:700">अहिले लोड गर्ने</button><button id="swx" style="padding:6px 10px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff">पछि</button>';
 document.body.appendChild(d);
 document.getElementById('swr').onclick=()=>{if(confirm('पेज फेरि लोड हुन्छ। भरिरहेको तर सुरक्षित नगरेको विवरण भए पहिले सुरक्षित गर्नुहोस्। जारी राख्ने?'))location.reload()};
 document.getElementById('swx').onclick=()=>d.remove()}
try{if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.t==='sw-upd')updBanner()})}catch(e){}
const _sf=setFeat;
setFeat=function(k,v){const r=_sf.apply(this,arguments);if(k==='sw')swApply().then(()=>{try{if(S.sub==='offline')render()}catch(e){}});return r};
window.addEventListener('load',()=>setTimeout(swApply,1200));

async function probe(){const el=document.getElementById('offs');if(!el)return;
 const row=(ok_,t,d)=>`<div class="row" style="gap:8px;padding:5px 0"><span style="flex:0 0 auto">${ok_===true?'✅':ok_===false?'❌':'➖'}</span><span style="flex:1;min-width:0"><b>${t}</b>${d?`<div class="s">${d}</div>`:''}</span></div>`;
 let h='';const sup='serviceWorker' in navigator;
 h+=row(sup,'ब्राउजरले समर्थन गर्छ',sup?'':'यो ब्राउजरमा अफलाइन सुविधा छैन');
 h+=row(envOk(),'सुरक्षित ठेगाना (https / localhost)',envOk()?esc(location.origin):'अहिलेको ठेगाना: '+esc(location.protocol)+' — फाइल सिधै खोलेको वा सुरक्षित नभएको ठेगानामा चल्दैन');
 let reg=null,cached=null,pers=null;
 try{if(sup)reg=await navigator.serviceWorker.getRegistration(SC())}catch(e){}
 try{if(window.caches){const ks=(await caches.keys()).filter(k=>k.indexOf('dairy-hisab-')===0);cached=false;for(const k of ks){const c=await caches.open(k);if((await c.keys()).length)cached=true}}}catch(e){}
 try{if(navigator.storage&&navigator.storage.persisted)pers=await navigator.storage.persisted()}catch(e){}
 const act=reg&&(reg.active||reg.waiting||reg.installing);
 h+=row(feat('sw')?!!act:null,'Service Worker दर्ता',feat('sw')?(act?'दर्ता भएको ('+esc(act.state)+')'+(navigator.serviceWorker.controller?' · यो पेज नियन्त्रणमा छ':' · पेज एकपटक फेरि खोल्दा नियन्त्रणमा आउँछ'):'दर्ता भएको छैन'):'सुविधा बन्द छ');
 h+=row(feat('sw')?(cached===null?null:cached):null,'एप फोनमा सुरक्षित (क्यास)',cached?'इन्टरनेट नभए पनि एप खुल्छ':'चालु गरेपछि एकपटक इन्टरनेटमा खोल्नुहोस्');
 h+=row(pers===null?null:pers,'डेटा स्थायी भण्डारणमा',pers?'ब्राउजरले ठाउँ अभावमा पनि डेटा नमेट्ने':'ब्राउजरले ठाउँ अभावमा हटाउन सक्छ — तलको बटन थिच्नुहोस्');
 if(SWERR)h+=`<div class="s neg" style="margin-top:6px">${esc(SWERR)}</div>`;
 el.innerHTML=h}
window.offUpd=async function(){try{const r=await navigator.serviceWorker.getRegistration(SC());if(!r)return toast('दर्ता छैन');await r.update();toast('जाँच गरियो');probe()}catch(e){toast('जाँच हुन सकेन')}};
window.offClr=async function(){if(!confirm('फोनमा सुरक्षित एपको प्रतिलिपि (क्यास) खाली गर्ने? डेटा (ग्राहक, हिसाब) मेटिँदैन। इन्टरनेटमा एकपटक खोल्दा फेरि बन्छ।'))return;try{if(window.caches)for(const k of await caches.keys())if(k.indexOf('dairy-hisab-')===0)await caches.delete(k);toast('क्यास खाली भयो')}catch(e){toast('हुन सकेन')}probe()};
window.offPers=async function(){try{const r=await navigator.storage.persist();toast(r?'✓ स्थायी भण्डारण मिल्यो':'ब्राउजरले अहिले दिएन (एप स्थापना गरेपछि मिल्न सक्छ)')}catch(e){toast('हुन सकेन')}probe()};
window.offDl=function(){try{const b=new Blob([SW_SRC],{type:'text/javascript'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sw.js';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast('डाउनलोड हुन सकेन')}};
window.offV=function(){
 if(!ok()){S.sub=null;toast('यो भाग प्रशासकका लागि मात्र हो');return setV()}
 setTimeout(probe,0);
 return`${sbk('अफलाइन एप (Service Worker)')}
<div class="s">तपाईंको डेटा (ग्राहक, अर्डर, हिसाब) पहिल्यै यही फोनमा छ। यो सुविधाले <b>एपको फाइल</b> पनि फोनमा राख्छ, ताकि इन्टरनेट नभए वा ब्राउजर क्यास गए पनि एप खुलोस्। डेटालाई यसले छुँदैन।</div>
<div class="card" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="ft_sw" ${feat('sw')?'checked':''} onchange="setFeat('sw',this.checked)" style="width:18px;height:18px;flex:0 0 auto"><label for="ft_sw" style="flex:1"><b>अफलाइन एप चालु गर्ने</b></label></div>
<div class="card"><b>अवस्था</b><div id="offs" class="s" style="margin-top:6px">जाँच गर्दैछ…</div></div>
<div class="card"><b>चालु गर्न के चाहिन्छ</b>
<div class="s" style="margin-top:6px">१. एप र <b>sw.js</b> एउटै फोल्डरमा, https होस्टिङमा राख्नुहोस् (जस्तै GitHub Pages, Netlify, Cloudflare Pages — निःशुल्क)।<br>२. sw.js तल डाउनलोड गर्न सकिन्छ; यो एपको index.html सँगै उही फोल्डरमा राख्नुहोस्।<br>३. माथि "चालु गर्ने" छानेर एकपटक इन्टरनेटमा एप खोल्नुहोस्। माथि सबै ✅ भए तयार।<br>४. फोनको फाइल (file://) बाट सिधै खोलेको भए यो चल्दैन।</div>
<div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><button class="b" onclick="offDl()">sw.js डाउनलोड</button><button class="b g" onclick="offUpd()">नयाँ संस्करण जाँच</button><button class="b g" onclick="offPers()">स्थायी भण्डारण माग्ने</button><button class="b g" onclick="offClr()">क्यास खाली गर्ने</button></div></div>
<div class="s">एपको HTML फाइल बदलेर होस्टिङमा हालेपछि, अर्को पटक खोल्दा "नयाँ संस्करण तयार छ" सूचना आउँछ।</div>`};
